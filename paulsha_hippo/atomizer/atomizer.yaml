schema_version: 1
context_window: 32768
max_input_tokens: 12000
max_prompt_argv_bytes: 49152
chunk_retries: 2
parallelism: 1
split:
  boundary_patterns:
    - '^#{1,6}\s'
  max_fragment_chars: 8000
artifact_kind_map:
  research: research
  plan: plan
  plans: plan
  spec: spec
  report: report
  reports: report
  review: review
  session: report
  sessions: report
phase_map:
  research: research
  spec: define
  plan: plan
  report: review
  review: review
default_artifact_kind: report
default_phase: review
external_agents:
  deadline_seconds: 600
  max_attempts: 6
  max_agent_calls: 6
  profiles:
    - id: claude
      enabled: true
      tier: 1
      priority: 10
      # issue #89: 1800s deadline cap (#85) / 240s per chunk ~= 7.5 chunks;
      # keep 7-chunk sessions on tier-1 instead of falling to tier-2 cg.
      max_session_chunks: 7
      traits: [judge, reasoner]
      task_classes: [atomization, title, skillopt]
      model: sonnet
      supported_models: [sonnet]
      effort: high
      supported_efforts: [medium, high, xhigh]
      argv: [claude, --model, "{MODEL}", --effort, "{EFFORT}", --safe-mode, --disable-slash-commands, --strict-mcp-config, --mcp-config, '{"mcpServers":{}}', --tools, "", --no-session-persistence, --print]
    - id: codex
      enabled: true
      tier: 1
      priority: 20
      # issue #89: keep tier-1 (claude/codex) aligned on max_session_chunks.
      max_session_chunks: 7
      traits: [judge, reasoner]
      task_classes: [atomization, title, skillopt]
      model: gpt-5.6-sol
      supported_models: [gpt-5.6-sol]
      effort: high
      supported_efforts: [high]
      argv: [codex, exec, --model, "{MODEL}", -c, model_reasoning_effort=high, --sandbox, read-only, --skip-git-repo-check, --ephemeral, --ignore-user-config, --ignore-rules, --disable, shell_tool, -]
    - id: agy
      enabled: true
      tier: 2
      priority: 10
      traits: [fast, responsive]
      task_classes: [title, skillopt]
      model: default
      supported_models: [default]
      effort: medium
      supported_efforts: [low, medium, high]
      argv: [agy, --model, "{MODEL}", --effort, "{EFFORT}", --mode, plan, --sandbox, --print]
    - id: cg
      enabled: false
      tier: 2
      priority: 20
      # issue #99：cg 對一般 session 是最穩的 profile（organic 勝出 80.9%、
      # promote 100%），但對大 payload 已實證不可靠——>6 chunks 的 session
      # （實例 213KB/47+ fragments）燒 153s 後吐出不可解析 JSON（exit 3）。
      # 宣告閘門讓這類 session 以 session_size 立即不合格、直接落到 tier-3，
      # 而不是先浪費 153s 再失敗。tier-1 上限為 7，故 cg 實際只會接到
      # tier-1 因其他原因失敗的 ≤6 chunk session。
      # 完整的 copilot 大 payload 可靠性量測仍未完成，見 issue #99。
      max_session_chunks: 6
      traits: [heavy-implementation, fast]
      task_classes: [atomization, title, skillopt]
      model: default
      supported_models: [default]
      effort: high
      supported_efforts: [medium, high, xhigh]
      argv: [cg, --model, "{MODEL}", --effort, "{EFFORT}", --headless, --stdin]
    - id: co-gem
      enabled: false
      tier: 3
      priority: 10
      traits: [low-cost, fallback]
      task_classes: [atomization, title, skillopt]
      model: local
      supported_models: [local]
      effort: low
      supported_efforts: [low, medium]
      argv: [co-gem, --model, "{MODEL}", --effort, "{EFFORT}", --headless, --stdin]
    - id: claude-gem
      enabled: false
      tier: 3
      priority: 20
      traits: [low-cost, fallback]
      task_classes: [atomization, title, skillopt]
      model: local
      supported_models: [local]
      effort: low
      supported_efforts: [low, medium]
      argv: [claude-gem, --model, "{MODEL}", --effort, "{EFFORT}", --headless, --stdin]
# #175: 預設 llm 蒸餾。identity 會把 importer 樣板 fragments 1:1 複製成
# knowledge slices（樣板噪音），僅保留為顯式 --promoter identity（測試/離線）。
promoter: llm
skill_path: skills/atomize-knowledge-slice.md
